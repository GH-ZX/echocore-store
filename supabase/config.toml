[functions.g2bulk-sync-cron]
verify_jwt = false

# Server-side fulfillment reconciliation sweep (pg_cron -> pg_net -> this function).
# JWT off so pg_net can hit it with x-g2bulk-cron-secret; longer timeout for polling.
[functions.g2bulk-fulfill-cron]
verify_jwt = false

[functions.g2bulk-fulfill-cron.limits]
timeout = 300

# App-level auth in the function. JWT off so G2Bulk top-up webhooks can POST without a Supabase token.
[functions.g2bulk]
verify_jwt = false

# Binance Pay merchant integration: signing (HMAC-SHA512) is app-level; the
# webhook delivery from Binance carries no Supabase JWT so JWT must be off.
[functions.binance-pay]
verify_jwt = false